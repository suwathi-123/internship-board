<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Internship Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Internship Board</h1>
            <p>Find your next internship opportunity</p>
        </div>
    </header>

    <main class="container">

     
        <section class="filters">

            <div class="form-group">
                <label for="searchInput">Search internships</label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search by role, company or location..."
                >
            </div>

            <div class="form-group">
                <label for="domainFilter">Select Domain</label>

                <select id="domainFilter">
                    <option value="all">All Domains</option>
                    <option value="Frontend Development">Frontend Development</option>
                    <option value="Backend Development">Backend Development</option>
                    <option value="Full Stack Development">Full Stack Development</option>
                    <option value="Data Science">Data Science</option>
                    <option value="AI/ML">AI/ML</option>
                    <option value="Cyber Security">Cyber Security</option>
                </select>
            </div>

        </section>

      
        <div class="result-info">
            <p id="resultCount">Loading internships...</p>
        </div>

      
        <section
            id="internshipList"
            class="internship-grid"
            aria-live="polite">
        </section>

      
        <div id="emptyState" class="message hidden">
            <h2>No internships found</h2>
            <p>Try changing your search or domain filter.</p>
        </div>

       
        <div id="errorState" class="message hidden">
            <h2>Something went wrong</h2>
            <p>Unable to load internship data.</p>
        </div>

    </main>

    <footer>
        <p>© 2026 Internship Board</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
